name: .NET 10 & Docker CI/CD Pipeline

# 1. 触发条件：当代码推送到 main/master 分支，或者提交 Pull Request 时自动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 控制台手动一键运行

jobs:
  # 阶段 1：C# 代码编译与单元测试 (CI)
  build-and-test:
    name: 1. 代码编译与测试 (CI)
    runs-on: ubuntu-latest

    steps:
    - name: 拉取仓库最新代码
      uses: actions/checkout@v4

    - name: 配置 .NET 10 SDK 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 还原依赖包 (dotnet restore)
      run: dotnet restore

    - name: 编译项目 (dotnet build)
      run: dotnet build --no-restore --configuration Release

  # 阶段 2：构建 Docker 镜像并推送至 AWS ECR (CD)
  docker-build-and-push:
    name: 2. Docker 镜像构建与推送 (CD)
    needs: build-and-test  # 只有在 CI 编译通过后才开始构建与推送
    runs-on: ubuntu-latest

    steps:
    - name: 拉取仓库最新代码
      uses: actions/checkout@v4

    - name: 配置 AWS 凭证
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 登录 Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 构建并推送镜像至 ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG