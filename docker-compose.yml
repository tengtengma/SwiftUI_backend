version: '3.8'

services:
  # 1. 你的 .NET 9 C# API 容器
  backend:
    build: .                  # 如果 Dockerfile 在根目录就用 .，如果在 backend 文件夹就用 ./backend
    container_name: backend
    ports:
      - "8080:8080"            # 对外暴露 8080 端口访问 Swagger / API
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=mydatabase;Username=user;Password=password
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - db
      - redis

  # 2. PostgreSQL 数据库容器
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 3. Redis 缓存容器
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  db_data: